<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050b14">
<link rel="manifest" href="admin.webmanifest">
<link rel="apple-touch-icon" href="admin-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SW Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Space Wings · Administrador</title>
<style>
:root{--bg:#050b14;--card:#0d1526;--card2:#111c33;--borde:rgba(255,255,255,.10);--cian:#00e5ff;--cian2:#00c8ff;--txt:#fff;--muted:#9fb0c8;--ok:#22c55e;--mal:#ef4444;--warn:#fbbf24;--grad:linear-gradient(135deg,#6af8ff,#00c8ff)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg) radial-gradient(ellipse 80% 40% at 50% 0,rgba(0,229,255,.14),transparent 70%) no-repeat;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:110px}
button,input,select,textarea{font:inherit;color:inherit}
.oculto{display:none!important}
/* Login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-caja{width:100%;max-width:380px;background:var(--card);border:1px solid rgba(0,229,255,.35);border-radius:24px;padding:28px 22px;box-shadow:0 0 40px rgba(0,229,255,.12);text-align:center}
.login-caja h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:2px;background:linear-gradient(180deg,#fff,#00e5ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.login-caja p{margin:0 0 20px;color:var(--muted);font-size:.9rem}
.campo{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--borde);background:var(--card2);font-size:16px;outline:none}
.campo:focus{border-color:var(--cian);box-shadow:0 0 0 3px rgba(0,229,255,.22)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;cursor:pointer;background:var(--grad);color:#031018;min-height:48px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--muted);border:1px solid var(--borde);font-weight:600;min-height:40px;padding:8px 12px;font-size:.85rem;white-space:nowrap}
#login .btn{width:100%;margin-top:12px}
.error{color:#fca5a5;font-size:.88rem;min-height:1.2em;margin-top:10px}
/* Cabecera */
header{position:sticky;top:0;z-index:40;background:rgba(5,11,20,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--borde);padding:10px 14px calc(0px);}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:900px;margin:0 auto}
.top h2{margin:0;font-size:.95rem;letter-spacing:1px;white-space:nowrap}
.top h2 span{color:var(--cian)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:900px;margin:10px auto 0;padding-bottom:10px}
.tab{flex:0 0 auto;border:1px solid var(--borde);background:transparent;color:var(--muted);border-radius:999px;padding:9px 16px;font-weight:700;font-size:.88rem;cursor:pointer;white-space:nowrap;min-height:42px}
.tab.on{background:var(--grad);color:#031018;border-color:transparent}
.tab .pt{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--warn);color:#1a1200;font-size:.72rem}
main{max-width:900px;margin:0 auto;padding:16px 14px}
.nota{color:var(--muted);font-size:.88rem;margin:0 0 14px;line-height:1.45}
/* Filas */
.lista{display:grid;gap:10px}
.fila{background:var(--card);border:1px solid var(--borde);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
.fila.cambio{border-color:var(--warn);box-shadow:0 0 0 1px rgba(251,191,36,.35)}
.fila.apagado .nombre{opacity:.55}
.seg{display:flex;border:1px solid var(--borde);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:8px 10px;font-size:.76rem;font-weight:800;min-height:40px;cursor:pointer;border-right:1px solid var(--borde)}
.seg button:last-child{border-right:0}
.seg button.on[data-v="SI"]{background:var(--ok);color:#04210f}
.seg button.on[data-v="NO"]{background:var(--warn);color:#1a1200}
.seg button.on[data-v="OCULTO"]{background:#64748b;color:#fff}

.nombre{font-weight:700;line-height:1.25}
.nombre small{display:block;color:var(--muted);font-weight:500;font-size:.78rem;margin-top:2px}
.ctrl{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.precio{display:flex;align-items:center;background:var(--card2);border:1px solid var(--borde);border-radius:12px;padding:0 10px}
.precio span{color:var(--muted)}
.precio input{width:78px;border:0;background:transparent;padding:10px 4px;font-size:16px;font-weight:800;text-align:right;outline:none}
.precio:focus-within{border-color:var(--cian)}
.sw{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;color:var(--muted);cursor:pointer;user-select:none}
.sw input{display:none}
.sw i{width:48px;height:28px;border-radius:14px;background:#2a354d;position:relative;transition:.2s;display:block}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{left:23px}
.sw.malo input:checked+i{background:var(--cian2)}
.mini{width:64px;padding:10px 8px;text-align:center;border-radius:12px;border:1px solid var(--borde);background:var(--card2);font-size:16px;outline:none}
.salsa-nombre{min-width:0;width:100%}
/* Tarjetas de ajustes */
.panel{background:var(--card);border:1px solid var(--borde);border-radius:18px;padding:16px;margin-bottom:14px}
.panel h3{margin:0 0 4px;font-size:1.05rem}
.panel .sub{margin:0 0 14px;color:var(--muted);font-size:.85rem}
.etq{display:block;font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin:12px 0 5px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
textarea.campo{min-height:92px;resize:vertical;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0}
.chip span{display:block;padding:9px 14px;border-radius:999px;border:1px solid var(--borde);background:var(--card2);font-size:.86rem;cursor:pointer;min-height:40px;line-height:22px}
.chip input:checked+span{background:rgba(239,68,68,.18);border-color:var(--mal);color:#fecaca}
.chips.verde .chip input:checked+span{background:rgba(0,229,255,.16);border-color:var(--cian);color:#c8f8ff}
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 4px}
.interruptor b{font-size:.95rem}
.vista{margin-top:12px;border:1px dashed rgba(0,229,255,.4);border-radius:12px;padding:10px 12px;background:rgba(0,229,255,.05);overflow:hidden}
.vista small{display:block;color:var(--muted);margin-bottom:6px}
.vista .marq{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.vista strong,.prev-mision strong{color:var(--cian)}
.prev-mision{margin-top:8px;color:#dbe6f5;font-size:.92rem;line-height:1.4}
.mision{border-top:1px solid var(--borde);margin-top:16px;padding-top:6px}
.mision h4{margin:10px 0 0;font-size:.95rem;color:var(--cian)}
/* Barra de guardado */
#barra{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(5,11,20,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(0,229,255,.35);display:flex;gap:10px;justify-content:center;transform:translateY(120%);transition:transform .25s}
#barra.on{transform:none}
#barra .btn{flex:1;max-width:420px}
#bloqueo{position:fixed;inset:0;z-index:200;background:var(--bg,#050b14);display:flex;align-items:center;justify-content:center;padding:20px}
#bloqueo .login-caja{max-width:340px}
.huella{font-size:3.2rem;line-height:1;margin:6px 0 14px}
.recordar{display:flex;align-items:center;gap:10px;margin:12px 2px 0;text-align:left;font-size:.88rem;color:var(--muted)}
.recordar input{width:20px;height:20px;accent-color:#00e5ff;flex:none}
#segu{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#segu .hoja{width:100%;max-width:460px;background:#0b1a2e;border:1px solid var(--borde);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:10px}
#segu h3{margin:0 0 2px}#segu p{margin:0;color:var(--muted);font-size:.85rem}
.tkt{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:8px 0 0;min-height:44px;border-radius:14px;border:1px solid var(--borde);background:rgba(255,255,255,.06);color:inherit;font:inherit;font-weight:800;cursor:pointer}
.tkt:active{transform:scale(.98)}
@media print{body>*:not(#tkFrame){display:none!important}}
.avisar{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 0;min-height:46px;border-radius:14px;border:1px solid #25d366;color:#7dffb0;font-weight:800;text-decoration:none;background:rgba(37,211,102,.10)}
#conx{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer;width:fit-content;max-width:100%;padding:5px 12px;border-radius:999px;border:1px solid var(--borde);background:rgba(255,255,255,.03);transition:border-color .3s,color .3s}
#conx .pt{flex:none;width:9px;height:9px;border-radius:50%;background:var(--ok);animation:latido 2.4s infinite}
#conx.ok{color:#b8f5cf;border-color:rgba(34,197,94,.35)}
#conx.sync{color:#c8f8ff;border-color:rgba(0,229,255,.4)}
#conx.sync .pt{width:11px;height:11px;background:transparent;border:2px solid rgba(0,229,255,.3);border-top-color:#00e5ff;animation:giro .7s linear infinite}
#conx.warn{color:#ffe08a;border-color:rgba(251,191,36,.45)}#conx.warn .pt{background:var(--warn);animation:parpadeo 1.6s infinite}
#conx.err{color:#ffb4b4;border-color:rgba(239,68,68,.5)}#conx.err .pt{background:var(--mal);animation:parpadeo .9s infinite}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@keyframes giro{to{transform:rotate(360deg)}}
@keyframes parpadeo{50%{opacity:.3}}
#progreso{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
body.sync #progreso{opacity:1}
#progreso::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,#00e5ff,transparent);animation:barra 1.1s ease-in-out infinite}
@keyframes barra{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.rot{display:inline-block}
body.sync #btnRecargar .rot,body.sync #btnAct .rot{animation:giro .8s linear infinite}
.ped.trabajando{position:relative;overflow:hidden}
.ped.trabajando::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,#00e5ff,transparent) no-repeat;background-size:45% 100%;animation:barra2 1s linear infinite}
@keyframes barra2{from{background-position:-60% 0}to{background-position:170% 0}}
.est button.trab{animation:brillo .8s ease-in-out infinite}
@keyframes brillo{50%{filter:brightness(1.5)}}
.spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(3,16,24,.25);border-top-color:#031018;border-radius:50%;animation:giro .7s linear infinite;vertical-align:-3px;margin-right:6px}
.est button .spin{width:12px;height:12px;border-width:2px;margin:0}
.ped.ok-pop{animation:pop .55s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.02);box-shadow:0 0 0 3px rgba(34,197,94,.5)}100%{transform:scale(1)}}
.est button.pop{animation:popBtn .6s ease}
@keyframes popBtn{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.ped.sacudir{animation:sacudir .45s}
@keyframes sacudir{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);z-index:90;background:#0b1a2e;border:1px solid var(--cian);border-radius:14px;padding:12px 18px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.mal{border-color:var(--mal)}
.cargando{text-align:center;color:var(--muted);padding:40px 0}
@media (min-width:700px){.fila{grid-template-columns:1fr auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Pedidos */
.pt2{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:9px;background:#ef4444;color:#fff;font-size:.72rem;font-weight:800}
.resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.res{background:var(--card);border:1px solid var(--borde);border-radius:14px;padding:10px 6px;text-align:center}
.res b{display:block;font-size:1.3rem}.res span{font-size:.68rem;color:var(--muted)}
.filtros{display:flex;gap:8px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.filtros button{flex:0 0 auto;border:1px solid var(--borde);background:transparent;color:var(--muted);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.82rem;cursor:pointer;min-height:40px}
.filtros button.on{background:rgba(0,229,255,.15);border-color:var(--cian);color:#c8f8ff}
.ped{background:var(--card);border:1px solid var(--borde);border-radius:18px;padding:14px;margin-bottom:12px;border-left:5px solid #64748b}
.ped.Recibido{border-left-color:var(--warn)}.ped.EnRuta{border-left-color:var(--cian)}.ped.Entregado{border-left-color:var(--ok);opacity:.8}.ped.Cancelado{border-left-color:var(--mal);opacity:.65}
.ped-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ped-nom{font-weight:800;font-size:1.05rem}.ped-hora{color:var(--muted);font-size:.78rem;margin-top:2px}
.ped-tot{font-size:1.35rem;font-weight:900;color:var(--cian);white-space:nowrap}
.ped-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.ped-chip{padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--borde);font-size:.78rem;color:#dbe6f5;text-decoration:none}
.ped-chip.dom{border-color:rgba(0,229,255,.5)}
.ped-dir{margin:8px 0 0;font-size:.88rem;color:#dbe6f5}
.ped-prod{margin:10px 0;padding:10px 12px;background:#0a1222;border-radius:12px;font-size:.84rem;line-height:1.45;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}
.ped-desg{display:flex;gap:14px;font-size:.78rem;color:var(--muted);margin:0 0 10px}
.est{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--borde);border-radius:12px;overflow:hidden}
.est button{border:0;border-right:1px solid var(--borde);background:transparent;color:var(--muted);padding:9px 2px;font-size:.72rem;font-weight:800;min-height:44px;cursor:pointer}
.est button:last-child{border-right:0}
.est button.on.Recibido{background:var(--warn);color:#1a1200}.est button.on.EnRuta{background:var(--cian2);color:#031018}.est button.on.Entregado{background:var(--ok);color:#04210f}.est button.on.Cancelado{background:var(--mal);color:#fff}
.est button:disabled{opacity:.6}
.vacio{text-align:center;color:var(--muted);padding:30px 0}
/* ===== Móvil / pedidos v2 ===== */
.filtros-wrap{position:sticky;top:var(--alto-cab,96px);z-index:30;background:linear-gradient(180deg,var(--bg) 75%,transparent);margin:0 -14px 8px;padding:6px 14px 8px}
.filtros{margin:0!important}
.filtros button i{font-style:normal;display:inline-block;min-width:20px;margin-left:5px;padding:1px 6px;border-radius:9px;background:rgba(255,255,255,.12);font-size:.74rem}
.filtros button.on.f-Recibido{background:rgba(251,191,36,.18);border-color:var(--warn);color:#fde68a}
.filtros button.on.f-EnRuta{background:rgba(0,200,255,.18);border-color:var(--cian2);color:#c8f8ff}
.filtros button.on.f-Entregado{background:rgba(34,197,94,.18);border-color:var(--ok);color:#bbf7d0}
.filtros button.on.f-Cancelado{background:rgba(239,68,68,.18);border-color:var(--mal);color:#fecaca}
.busq{display:flex;gap:8px;margin:0 0 12px}.busq .campo{flex:1;padding:11px 14px;border-radius:999px}
.busq button{flex:0 0 46px;border-radius:50%;border:1px solid var(--borde);background:var(--card);color:var(--cian);font-size:1.2rem;cursor:pointer}
.ped-est{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:800;background:#334155;color:#fff;float:right}
.ped-est.Recibido{background:var(--warn);color:#1a1200}.ped-est.EnRuta{background:var(--cian2);color:#031018}.ped-est.Entregado{background:var(--ok);color:#04210f}.ped-est.Cancelado{background:var(--mal)}
.ped-prod.corto{max-height:4.6em;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.vermas{display:block;width:100%;margin:-4px 0 10px;background:none;border:0;color:var(--cian);font-weight:700;font-size:.82rem;padding:8px;cursor:pointer}
.next{display:block;width:100%;margin:0 0 10px;border:0;border-radius:14px;padding:15px;font-size:1rem;font-weight:900;cursor:pointer;background:var(--grad);color:#031018;min-height:54px;box-shadow:0 6px 18px rgba(0,229,255,.3)}
.next[data-s="Entregado"]{background:linear-gradient(135deg,#4ade80,#22c55e);color:#04210f;box-shadow:0 6px 18px rgba(34,197,94,.3)}
.next:active{transform:scale(.98)}
.est button{font-size:.68rem}
@media (max-width:700px){
 body{padding-bottom:150px}
 header{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(5,11,20,.97);padding-bottom:8px}
 .top h2{font-size:.9rem}
 .tabs{position:fixed;left:0;right:0;bottom:0;z-index:70;margin:0;max-width:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0;overflow:visible;background:rgba(5,11,20,.98);border-top:1px solid var(--borde);display:grid;grid-template-columns:repeat(6,1fr)}
 .tab{border:0;border-radius:12px;padding:6px 0 4px;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.62rem;position:relative;background:transparent}
 .tab .ti{font-size:1.35rem;line-height:1}
 .tab.on{background:rgba(0,229,255,.14);color:var(--cian)}
 .tab .pt,.tab .pt2{position:absolute;top:2px;right:8px;margin:0;font-size:.64rem;padding:0 5px;min-width:16px;text-align:center}
 #barra{bottom:calc(66px + env(safe-area-inset-bottom))}
 #barra:not(.on){visibility:hidden}
 #toast{bottom:150px}
 main{padding:12px 12px}
 .fila{grid-template-columns:1fr;gap:10px}
 .fila .ctrl{justify-content:space-between;width:100%;flex-wrap:wrap;gap:10px}
 .fila .seg{order:3;flex:1 1 100%}.fila .seg button{flex:1;padding:10px 2px;min-height:46px;font-size:.84rem}
 .fila .seg button.on{box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
 .precio input{width:84px}
 .dos{grid-template-columns:1fr}
 .panel{padding:14px}
 .ped{padding:12px}
 .filtros-wrap{margin:0 -12px 8px;padding:6px 12px 8px}
}
</style>
</head>
<body>
<div id="progreso"></div>

<!-- ENTRADA -->
<section id="login">
  <form class="login-caja" id="formLogin" autocomplete="on">
    <h1>SPACE WINGS</h1>
    <p>Panel de administración</p>
    <input class="campo" type="password" id="clave" placeholder="Contraseña" autocomplete="current-password" required>
    <label class="recordar"><input type="checkbox" id="chkRecordar" checked> Recordar este dispositivo (30 días)</label>
    <button class="btn" id="btnEntrar" type="submit">Entrar</button>
    <div class="error" id="errLogin"></div>
  </form>
</section>

<!-- BLOQUEO CON HUELLA -->
<section id="bloqueo" class="oculto">
  <div class="login-caja">
    <h1>SPACE WINGS</h1>
    <div class="huella">🔒</div>
    <p>Panel bloqueado</p>
    <button class="btn" id="btnDesbloquear" type="button">Desbloquear con huella</button>
    <button class="btn sec" id="btnOtraCuenta" type="button" style="width:100%;margin-top:10px">Usar contraseña</button>

</section>

<!-- SEGURIDAD -->
<section id="segu" class="oculto">

    <h3>🔐 Seguridad</h3>
    <p id="seguInfo"></p>
    <button class="btn" id="btnToggleHuella" type="button"></button>
    <button class="btn sec" id="btnTodos" type="button" style="min-height:48px">Cerrar sesión en todos los dispositivos</button>

<!-- PANEL -->
<section id="panel" class="oculto">
  <header>
    <div class="top">
      <h2>SPACE <span>WINGS</span> Admin</h2>
      <div style="display:flex;gap:8px">
        <button class="btn sec" id="btnRecargar" type="button" aria-label="Actualizar"><span class="rot">↻</span></button>
        <button class="btn sec" id="btnSegu" type="button" aria-label="Seguridad">🔐</button>

      </div>

  <main id="vista"><div class="cargando">Cargando datos…</div></main>
</section>

<div id="barra"><button class="btn sec" id="btnDescartar" type="button">Descartar</button><button class="btn" id="btnGuardar" type="button">Guardar cambios</button></div>
<div id="toast" role="status"></div>

<script>
/* ============================================================
   CONFIGURACIÓN: pega aquí la URL de tu Apps Script de ADMIN
   (Implementar > Administrar implementaciones > URL de la app web)
   ============================================================ */
const URL_ADMIN = 'PEGA_AQUI_LA_URL_DEL_APPS_SCRIPT_ADMIN';

const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const TABS = [
  {id:'pedidos',   t:'🧾 Pedidos'},
  {id:'platillos', t:'🍗 Platillos'},
  {id:'combos',    t:'🎁 Combos'},
  {id:'salsas',    t:'🌶️ Salsas'},
  {id:'horario',   t:'🕖 Horario'},
  {id:'anuncios',  t:'📣 Anuncios'}
];
let token = null, orig = null, edit = null, tabActual = 'pedidos';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const negritas = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const esSi = v => String(v).trim().toUpperCase() === 'SI';
const clone = o => JSON.parse(JSON.stringify(o));

function toast(msg, mal) {
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('mal', !!mal); t.classList.add('on');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600);
}

async function apiRaw(accion, extra) {
  if (URL_ADMIN.indexOf('PEGA_AQUI') === 0) throw new Error('Falta configurar URL_ADMIN en admin.html');
  const r = await fetch(URL_ADMIN, { method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({accion, token}, extra || {})) });
  const j = await r.json();
  if (!j.ok && j.error === 'sesion') { cerrarSesion(true); throw new Error(j.mensaje); }
  return j;
}


/* ---------- Indicador de conexión con la hoja + animaciones de trabajo ---------- */
let ocupadoApi = 0, ultimaSync = 0, conxError = '', conxAviso = '';
const hace = s => s < 60 ? s + ' s' : Math.floor(s / 60) + ' min';
function conxPintar() {
  const c = $('#conx'); if (!c) return;
  let cls, txt;
  if (ocupadoApi > 0) { cls = 'sync'; txt = 'Sincronizando…'; }
  else if (conxError) { cls = 'err'; txt = 'Sin conexión con la hoja · toca para reintentar'; }
  else if (conxAviso) { cls = 'warn'; txt = conxAviso; }
  else if (!ultimaSync) { cls = 'sync'; txt = 'Conectando…'; }
  else {
    const s = Math.round((Date.now() - ultimaSync) / 1000);
    if (s > 90) { cls = 'warn'; txt = 'Datos de hace ' + hace(s) + ' · toca para actualizar'; }
    else { cls = 'ok'; txt = 'Conectado · datos al día' + (s >= 5 ? ' · hace ' + hace(s) : ''); }
  }
  c.className = cls; c.querySelector('.ct').textContent = txt;
  document.body.classList.toggle('sync', ocupadoApi > 0);
}
async function api(accion, extra) {
  ocupadoApi++; conxPintar();
  try {
    const j = await apiRaw(accion, extra);
    conxError = ''; ultimaSync = Date.now();
    conxAviso = (j && j.ok === false && j.error !== 'sesion') ? 'Aviso: ' + String(j.mensaje || 'la hoja respondió con un error').slice(0, 70) : '';
    return j;
  } catch (e) { if (token) conxError = e.message || 'error'; throw e; }
  finally { ocupadoApi--; conxPintar(); }
}
setInterval(conxPintar, 5000);
$('#conx').addEventListener('click', () => { if (token && !ocupadoApi) { toast('Actualizando…'); cargarPedidos(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && token) cargarPedidos(); });

/* ---------- Sesión ---------- */
$('#formLogin').addEventListener('submit', async e => {
  e.preventDefault();
  const b = $('#btnEntrar'); b.disabled = true; b.textContent = 'Verificando…'; $('#errLogin').textContent = '';
  try {
    const j = await api('login', {clave: $('#clave').value, recordar: $('#chkRecordar').checked});
    if (!j.ok) throw new Error(j.mensaje);
    guardarToken(j.token, !!j.recordado);
    $('#clave').value = '';
    await cargar();
  } catch (err) { $('#errLogin').textContent = err.message; }
  b.disabled = false; b.textContent = 'Entrar';
});

/* Token: localStorage si se recordó el dispositivo; si no, sessionStorage */
function guardarToken(t, recordar) {
  token = t;
  try { sessionStorage.removeItem('sw_tok'); localStorage.removeItem('sw_tok'); (recordar ? localStorage : sessionStorage).setItem('sw_tok', t); } catch(_){}
}
function leerToken() { try { return localStorage.getItem('sw_tok') || sessionStorage.getItem('sw_tok'); } catch(_) { return null; } }

function cerrarSesion(porExpirar) {
  token = null; detenerPoll(); pedidos = []; maxFilaVista = null;
  try { sessionStorage.removeItem('sw_tok'); localStorage.removeItem('sw_tok'); localStorage.removeItem('sw_cred'); } catch(_){}
  bloqueado = false; $('#bloqueo').classList.add('oculto'); $('#segu').classList.add('oculto');
  $('#panel').classList.add('oculto'); $('#login').classList.remove('oculto'); $('#barra').classList.remove('on');
  if (porExpirar) $('#errLogin').textContent = 'Tu sesión expiró. Vuelve a entrar.';
}
$('#btnSalir').addEventListener('click', async () => { try { await api('salir'); } catch(_){} cerrarSesion(); });
$('#btnRecargar').addEventListener('click', () => { if (hayCambios() && !confirm('Tienes cambios sin guardar. ¿Descartarlos y actualizar?')) return; cargar(); });

/* ---------- Carga ---------- */
async function cargar() {
  $('#login').classList.add('oculto'); $('#panel').classList.remove('oculto');
  $('#vista').innerHTML = '<div class="cargando">Cargando datos…</div>';
  try {
    const j = await api('leer'); if (!j.ok) throw new Error(j.mensaje);
    orig = j.datos; edit = clone(orig); normalizar(); orig = clone(edit);
    pintarTabs(); pintar(); actualizarBarra(); badgePedidos(); cargarPedidos(); iniciarPoll();
  } catch (err) { if (token) $('#vista').innerHTML = '<div class="cargando">No se pudo cargar: ' + esc(err.message) + '</div>'; }
}
function normalizar() {
  edit.platillos.forEach(p => { p.precio = String(p.precio).replace(/[^\d.]/g,''); p.disponible = estado3(p.disponible); p.medias = esSi(p.medias) ? 'SI' : 'NO'; });
  edit.combos.forEach(p => { p.precio = String(p.precio).replace(/[^\d.]/g,''); p.disponible = estado3(p.disponible); });
  edit.salsas.forEach(p => { p.disponible = esSi(p.disponible) ? 'SI' : 'NO'; });
  edit.anuncios.marquesina_activa = esSi(edit.anuncios.marquesina_activa) ? 'SI' : 'NO';
  edit.anuncios.secreto_activo = esSi(edit.anuncios.secreto_activo) ? 'SI' : 'NO';
}

/* ---------- Cambios ---------- */
function difer(a, b) { return JSON.stringify(a) !== JSON.stringify(b); }
function cambiosPorTab() {
  const out = {};
  ['platillos','combos','salsas'].forEach(k => {
    out[k] = edit[k].filter((x, i) => difer(x, orig[k][i]));
  });
  out.horario = difer(edit.config, orig.config) ? [edit.config] : [];
  out.pedidos = [];
  out.anuncios = Object.keys(edit.anuncios).filter(k => edit.anuncios[k] !== orig.anuncios[k]);
  return out;
}
function hayCambios() { if (!edit) return false; const c = cambiosPorTab(); return Object.keys(c).some(k => c[k].length); }
function actualizarBarra() {
  const c = cambiosPorTab(), total = Object.keys(c).reduce((n, k) => n + c[k].length, 0);
  $('#barra').classList.toggle('on', total > 0);
  $('#btnGuardar').textContent = 'Guardar ' + total + (total === 1 ? ' cambio' : ' cambios');
  document.querySelectorAll('.tab').forEach(t => {
    const n = c[t.dataset.id].length, pt = t.querySelector('.pt');
    if (n && !pt) t.insertAdjacentHTML('beforeend', '<span class="pt">' + n + '</span>');
    else if (n && pt) pt.textContent = n; else if (!n && pt) pt.remove();
  });
}
$('#btnDescartar').addEventListener('click', () => { edit = clone(orig); pintar(); actualizarBarra(); toast('Cambios descartados'); });
$('#btnGuardar').addEventListener('click', async () => {
  const c = cambiosPorTab(), b = $('#btnGuardar'); b.disabled = true; b.textContent = 'Guardando…';
  const cambios = {};
  if (c.platillos.length) cambios.platillos = c.platillos;
  if (c.combos.length) cambios.combos = c.combos;
  if (c.salsas.length) cambios.salsas = c.salsas;
  if (c.horario.length) cambios.config = c.horario[0];
  if (c.anuncios.length) { cambios.anuncios = {}; c.anuncios.forEach(k => cambios.anuncios[k] = edit.anuncios[k]); }
  try {
    const j = await api('guardar', {cambios}); if (!j.ok) throw new Error(j.mensaje);
    orig = clone(edit); pintar(); actualizarBarra(); toast('✔ Guardado. La página ya muestra los cambios.');
  } catch (err) { toast('No se guardó: ' + err.message, true); }
  b.disabled = false; actualizarBarra();
});
window.addEventListener('beforeunload', e => { if (hayCambios()) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- Pedidos ---------- */
const ESTADOS = ['Recibido','En Ruta','Entregado','Cancelado'];
let pedidos = [], busqPed = '', abiertos = new Set(), filtroPed = 'activos', pollPed = null, maxFilaVista = null, errPed = '';
const sinAc = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
function canon(e) { const n = sinAc(e); if (!n || n.indexOf('recib') === 0) return 'Recibido'; if (n.indexOf('ruta') > -1) return 'En Ruta'; if (n.indexOf('entreg') === 0) return 'Entregado'; if (n.indexOf('cancel') === 0) return 'Cancelado'; return String(e); }
const cls = e => String(e).replace(/\s/g, '');
function fechaPed(s) { const m = /(\d{1,2})\/(\d{1,2})\/(\d{4})[ ,]+(\d{1,2}):(\d{2})/.exec(String(s)); return m ? { d: +m[1], mo: +m[2], y: +m[3], h: +m[4], mi: +m[5] } : null; }
function esHoy(s) { const f = fechaPed(s); if (!f) return false; const n = new Date(new Date().toLocaleString('en-US', {timeZone: 'America/Mexico_City'})); return f.d === n.getDate() && f.mo === n.getMonth() + 1 && f.y === n.getFullYear(); }
function pitido() { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.setValueAtTime(.25, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .6); o.start(); o.stop(c.currentTime + .6); } catch (_) {} }

async function cargarPedidos() {
  try {
    const j = await api('pedidos'); if (!j.ok) throw new Error(j.mensaje);
    errPed = '';
    const nuevos = maxFilaVista == null ? [] : j.pedidos.filter(p => p.fila > maxFilaVista && canon(p.estatus) === 'Recibido');
    pedidos = j.pedidos;
    const mx = pedidos.reduce((m, p) => Math.max(m, p.fila), 0);
    if (maxFilaVista == null || mx > maxFilaVista) maxFilaVista = mx;
    if (nuevos.length) { pitido(); toast('🔔 Nuevo pedido de ' + (nuevos[0].nombre || 'cliente') + (nuevos.length > 1 ? ' (+' + (nuevos.length - 1) + ')' : '')); }
  } catch (err) { if (!token) return; errPed = err.message; }
  badgePedidos(); if (tabActual === 'pedidos') pintarPedidos();
}
function badgePedidos() {
  const n = pedidos.filter(p => { const e = canon(p.estatus); return e === 'Recibido' || e === 'En Ruta'; }).length;
  const t = document.querySelector('.tab[data-id="pedidos"]'); if (!t) return;
  let b = t.querySelector('.pt2'); if (n && !b) { t.insertAdjacentHTML('beforeend', '<span class="pt2">' + n + '</span>'); } else if (n && b) b.textContent = n; else if (!n && b) b.remove();
}
function detenerPoll() { clearInterval(pollPed); pollPed = null; }
function iniciarPoll() { detenerPoll(); pollPed = setInterval(() => { if (!document.hidden && token) cargarPedidos(); }, 30000); }

function pintarPedidos() {
  const v = $('#vista');
  const cnt = {Recibido: 0, 'En Ruta': 0, Entregado: 0, Cancelado: 0};
  pedidos.forEach(p => { const e = canon(p.estatus); if (cnt[e] != null) cnt[e]++; });
  const nHoy = pedidos.filter(p => esHoy(p.fecha)).length, q = sinAc(busqPed);
  const lista = pedidos.filter(p => {
    const e = canon(p.estatus);
    const okF = filtroPed === 'activos' ? (e === 'Recibido' || e === 'En Ruta') : filtroPed === 'hoy' ? esHoy(p.fecha) : filtroPed === 'todos' ? true : e === filtroPed;
    return okF && (!q || sinAc(p.nombre + ' ' + p.telefono + ' ' + p.colonia).indexOf(q) > -1);
  });
  const filtros = [['activos', '🔥 Activos', cnt.Recibido + cnt['En Ruta']], ['Recibido', 'Recibido', cnt.Recibido], ['En Ruta', 'En Ruta', cnt['En Ruta']],
    ['Entregado', 'Entregado', cnt.Entregado], ['Cancelado', 'Cancelado', cnt.Cancelado], ['hoy', 'Hoy', nHoy], ['todos', 'Todos', pedidos.length]];
  const prevBusq = document.getElementById('busqPed');
  v.innerHTML = (errPed ? '<div class="panel" style="border-color:var(--mal)"><b>No se pudieron cargar los pedidos</b><p class="sub" style="margin:6px 0 0">' + esc(errPed) + '</p></div>' : '') +
    '<div class="filtros-wrap"><div class="filtros">' + filtros.map(f => `<button type="button" data-f="${f[0]}" class="${filtroPed === f[0] ? 'on' : ''} f-${cls(f[0])}">${f[1]} <i>${f[2]}</i></button>`).join('') + '</div></div>' +
    `<div class="busq"><input id="busqPed" class="campo" type="search" placeholder="Buscar nombre, teléfono o colonia" value="${esc(busqPed)}"><button type="button" id="btnAct" aria-label="Actualizar"><span class="rot">↻</span></button></div>` +
    (lista.length ? lista.map(tarjetaPed).join('') : '<div class="vacio">' + (pedidos.length ? 'No hay pedidos con este filtro.' : 'Aún no hay pedidos.') + '</div>');
  v.querySelectorAll('.filtros button').forEach(b => b.addEventListener('click', () => { filtroPed = b.dataset.f; pintarPedidos(); }));
  const bi = document.getElementById('busqPed');
  bi.addEventListener('input', () => { busqPed = bi.value; const pos = bi.selectionStart; pintarPedidos(); const n = document.getElementById('busqPed'); n.focus(); n.setSelectionRange(pos, pos); });
  document.getElementById('btnAct').addEventListener('click', () => { toast('Actualizando…'); cargarPedidos(); });
  v.querySelectorAll('.est button, .next').forEach(b => b.addEventListener('click', () => cambiarEstatusPed(b)));
  v.querySelectorAll('.tkt').forEach(b => b.addEventListener('click', () => { const p = pedidos.find(x => String(x.fila) === b.closest('.ped').dataset.fila); if (p) imprimirTicket(p); }));
  v.querySelectorAll('.vermas').forEach(b => b.addEventListener('click', () => { const f = b.closest('.ped').dataset.fila; if (abiertos.has(f)) abiertos.delete(f); else abiertos.add(f); pintarPedidos(); }));
}
/* ===== Ticket 58 mm (sin QR) ===== */
function ticketHTML(p) {
  const e = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[^\d.\-]/g, '')); return isNaN(n) ? null : n; };
  const din = v => { const n = num(v); return n == null ? '0.00' : n.toFixed(2); };
  const dom = /domic/i.test(p.metodo) || (!p.metodo && p.calle);
  const tel10 = String(p.telefono || '').replace(/\D/g, '').slice(-10);
  const a = (orig && orig.anuncios) || {}, w = String(a.whatsapp || '').replace(/\D/g, '').slice(-10);
  const wa = w.length === 10 ? w.slice(0, 3) + '-' + w.slice(3, 6) + '-' + w.slice(6) : '';
  // Productos: "2x Nombre ($129.00)" + líneas "   └ extra"
  const items = [];
  String(p.productos || '').split('\n').forEach(l => {
    const t = l.trim(); if (!t) return;
    if (t.charAt(0) === '└') { if (items.length) items[items.length - 1].extra.push(t.replace(/^└\s*/, '')); return; }
    const m = t.match(/^(\d+)\s*x\s*(.+?)\s*\(\$?\s*([\d.,]+)\)\s*$/i);
    if (m) items.push({c: m[1], n: m[2], p: m[3].replace(/,/g, ''), extra: []});
    else items.push({c: '1', n: t, p: '', extra: []});
  });
  const filas = items.map(i => `<tr><td>${e(i.c)}</td><td>${e(i.n)}${i.extra.filter(x => !/^Subtotal/i.test(x)).map(x => `<span class="ex">· ${e(x)}</span>`).join('')}</td><td style="text-align:right">${i.p === '' ? '' : din(i.p)}</td></tr>`).join('');
  const sub = num(p.subtotal), env = num(p.envio);
  const tot = num(p.total) != null ? num(p.total) : (sub != null ? sub + (env || 0) : 0);
  const desg = (sub != null || env != null)
    ? `<div class="desg">${sub != null ? `<div><span>Subtotal</span><span>$${din(sub)}</span></div>` : ''}${dom ? `<div><span>Envío</span><span>$${din(env || 0)}</span></div>` : ''}</div>` : '';
  return `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Ticket ${e(p.nombre)}</title><style>
@page{size:58mm auto;margin:0}
body{font-family:'Courier New',monospace;margin:0;padding:5px;color:#000;background:#fff;display:flex;justify-content:center}
.t{width:200px;box-sizing:border-box;padding:4px}
.h{text-align:center;border-bottom:1.5px solid #000;margin-bottom:6px;padding-bottom:6px}
.l{font-size:18px;font-weight:bold;letter-spacing:1px}.s{font-size:9px;text-transform:uppercase}
.i{font-size:10px;margin-bottom:8px;line-height:1.25;word-wrap:break-word}
table{width:100%;border-collapse:collapse;font-size:10px}
th{border-bottom:1px solid #000;text-align:left;padding:3px 0}
td{padding:4px 0;border-bottom:1px dashed #ccc;vertical-align:top;word-wrap:break-word}
td:nth-child(3){white-space:nowrap}
.ex{display:block;font-size:9px;line-height:1.2;padding-left:4px}
.desg{margin-top:8px;font-size:10px}.desg div{display:flex;justify-content:space-between}
.tot{margin-top:6px;text-align:right;border-top:1.5px solid #000;padding-top:4px;font-size:13px}
.f{text-align:center;font-size:9px;margin-top:10px;padding-top:6px;line-height:1.2}
@media print{body{padding:0;background:#fff}.t{padding:0}}
</style></head><body><div class="t">
<div class="h"><div class="l">SPACE WINGS</div><div class="s">Sabor que te eleva</div></div>
<div class="i"><b>PEDIDO:</b> #${e(p.fila)}<br><b>CLIENTE:</b> ${e(p.nombre) || 'VENTA GENERAL'}<br><b>FECHA:</b> ${e(p.fecha)}<br><b>ENTREGA:</b> ${dom ? 'Domicilio' : 'Recoger'}${dom && (p.calle || p.colonia) ? `<br><b>DIR:</b> ${e(p.calle)}${p.colonia ? ', ' + e(p.colonia) : ''}` : ''}${tel10.length === 10 ? `<br><b>TEL:</b> ${e(tel10)}` : ''}</div>
<table><thead><tr><th style="width:25px">CAN</th><th>PRODUCTO</th><th style="text-align:right;width:55px">TOTAL</th></tr></thead><tbody>${filas}</tbody></table>
${desg}<div class="tot"><strong>TOTAL: $${din(tot)}</strong></div>
<div class="f">¡GRACIAS POR TU PREFERENCIA!${wa ? `<br><b>WA: ${e(wa)}</b>` : ''}<p style="font-size:8px;margin:6px 0 0">*** Comprobante de Venta ***</p></div>
</div></body></html>`;
}
function imprimirTicket(p) {
  try {
    let fr = document.getElementById('tkFrame');
    if (fr) fr.remove();
    fr = document.createElement('iframe'); fr.id = 'tkFrame';
    fr.setAttribute('aria-hidden', 'true');
    fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0;pointer-events:none';
    document.body.appendChild(fr);
    const d = fr.contentWindow.document; d.open(); d.write(ticketHTML(p)); d.close();
    setTimeout(() => { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (x) { toast('No se pudo abrir la impresión'); } }, 250);
  } catch (x) { toast('No se pudo generar el ticket'); }
}
function siguiente(p, e, dom) { return e === 'Recibido' ? (dom ? ['En Ruta', '🛵 Marcar En Ruta'] : ['Entregado', '✔ Marcar Entregado']) : e === 'En Ruta' ? ['Entregado', '✔ Marcar Entregado'] : null; }
function avisoCliente(p, e, dom, tel) {
  const clave = {'Recibido': 'msg_recibido', 'En Ruta': 'msg_en_ruta', 'Entregado': 'msg_entregado'}[e];
  const etq = {'Recibido': 'Confirmar pedido', 'En Ruta': 'Avisar: va en camino', 'Entregado': 'Avisar: entregado'}[e];
  const a = (orig && orig.anuncios) || {};
  if (!clave || tel.length < 10 || !a[clave]) return '';
  const tiempo = (dom ? a.tiempo_entrega : a.tiempo_recoger) || 'unos minutos';
  const total = p.total ? (String(p.total).indexOf('$') > -1 ? p.total : '$' + p.total) : '';
  const txt = String(a[clave]).replace(/\{nombre\}/g, String(p.nombre || '').split(' ')[0]).replace(/\{total\}/g, total).replace(/\{tiempo\}/g, tiempo);
  return `<a class="avisar" target="_blank" rel="noopener" href="https://wa.me/${tel.length === 10 ? '52' + tel : tel}?text=${encodeURIComponent(txt)}">💬 ${etq} por WhatsApp</a>`;
}
function tarjetaPed(p) {
  const e = canon(p.estatus), dom = /domic/i.test(p.metodo) || (!p.metodo && p.calle), tel = String(p.telefono || '').replace(/\D/g, '');

  const hora = (f ? ('0' + f.h).slice(-2) + ':' + ('0' + f.mi).slice(-2) + ' · ' : '') + esc(String(p.fecha).split(' ')[0]);
  const money = x => x === '' || x == null ? '' : (String(x).indexOf('$') > -1 ? x : '$' + x);
  const total = p.total || (p.subtotal ? '$' + (parseFloat(String(p.subtotal).replace(/[^\d.]/g, '')) + (parseFloat(String(p.envio).replace(/[^\d.]/g, '')) || 0)).toFixed(2) : '');
  const largo = String(p.productos).length > 110 || String(p.productos).split('\n').length > 3, abierto = abiertos.has(String(p.fila));
  const sig = siguiente(p, e, dom);
  return `<div class="ped ${cls(e)}" data-fila="${p.fila}" data-fecha="${esc(p.fecha)}" data-tel="${esc(p.telefono)}">
    <div class="ped-top"><div><div class="ped-nom">${esc(p.nombre) || 'Sin nombre'}</div><div class="ped-hora">${hora}</div></div><div><div class="ped-tot">${esc(money(total))}</div><span class="ped-est ${cls(e)}">${esc(e)}</span></div></div>

      ${tel.length >= 10 ? `<a class="ped-chip" href="tel:${esc(tel)}">📞 Llamar</a><a class="ped-chip" target="_blank" rel="noopener" href="https://wa.me/${tel.length === 10 ? '52' + tel : tel}">💬 WhatsApp</a>` : (p.telefono ? `<span class="ped-chip">📞 ${esc(p.telefono)}</span>` : '')}</div>
    ${dom && (p.calle || p.colonia) ? `<div class="ped-dir">📍 ${esc(p.calle)}${p.colonia ? ', ' + esc(p.colonia) : ''}</div>` : ''}
    <div class="ped-prod${largo && !abierto ? ' corto' : ''}">${esc(p.productos)}</div>

async function cambiarEstatusPed(btn) {
  const card = btn.closest('.ped'), nuevo = btn.dataset.s, p = pedidos.find(x => String(x.fila) === card.dataset.fila);
  if (!p || canon(p.estatus) === nuevo) return;
  if (nuevo === 'Cancelado' && !confirm('¿Cancelar el pedido de ' + (p.nombre || 'este cliente') + '?')) return;
  const previo = p.estatus; let exito = false;
  card.classList.add('trabajando'); btn.classList.add('trab');
  if (btn.classList.contains('next')) { btn.dataset.t = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>Guardando…'; }
  else { btn.dataset.t = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; }
  card.querySelectorAll('.est button, .next').forEach(b => b.disabled = true);
  try {
    const j = await api('estatus', {fila: p.fila, fecha: p.fecha, telefono: p.telefono, estatus: nuevo});
    if (!j.ok) throw new Error(j.mensaje);
    p.estatus = nuevo; exito = true; toast('✔ ' + (p.nombre || 'Pedido') + ': ' + nuevo);
  } catch (err) { p.estatus = previo; toast('No se cambió: ' + err.message, true); }
  badgePedidos(); pintarPedidos();
  const c2 = document.querySelector('.ped[data-fila="' + p.fila + '"]');
  if (c2) { c2.classList.add(exito ? 'ok-pop' : 'sacudir'); const b2 = c2.querySelector('.est button[data-s="' + nuevo + '"]'); if (exito && b2) b2.classList.add('pop'); }
}

function enlazarLista(k) {
  document.querySelectorAll('.fila').forEach(f => {
    const i = +f.dataset.i;

      edit[k][i].disponible = b.dataset.v;
      b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      marcarFilas(); actualizarBarra();
    }));
    f.querySelectorAll('[data-k]').forEach(inp => {
      const key = inp.dataset.k;
      inp.addEventListener(inp.type === 'checkbox' ? 'change' : 'input', () => {
        if (inp.type === 'checkbox') edit[k][i][key] = inp.checked ? 'SI' : 'NO';
        else if (key === 'precio') { inp.value = inp.value.replace(/[^\d.]/g, ''); edit[k][i][key] = inp.value; }

        else edit[k][i][key] = inp.value;
        marcarFilas(); actualizarBarra();
      });
    });
  });
}

/* ---------- Bloqueo con huella (WebAuthn, solo local) ---------- */
const b64 = {
  a2s: a => btoa(String.fromCharCode.apply(null, new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  s2a: s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0))
};
const credId = () => { try { return localStorage.getItem('sw_cred'); } catch(_) { return null; } };
const huellaSoportada = () => !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
const aleatorio = n => crypto.getRandomValues(new Uint8Array(n));

async function activarHuella() {
  const c = await navigator.credentials.create({ publicKey: {
    challenge: aleatorio(32), rp: { name: 'Space Wings Admin' },
    user: { id: aleatorio(16), name: 'admin', displayName: 'Administrador' },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
    timeout: 60000, attestation: 'none' } });
  localStorage.setItem('sw_cred', b64.a2s(c.rawId));
}
async function pedirHuella() {
  await navigator.credentials.get({ publicKey: {
    challenge: aleatorio(32), timeout: 60000, userVerification: 'required',
    allowCredentials: [{ type: 'public-key', id: b64.s2a(credId()) }] } });
}

let bloqueado = false, ocultoDesde = 0;
function bloquear() {
  if (!token || !credId() || bloqueado) return;
  bloqueado = true; $('#errBloqueo').textContent = ''; $('#bloqueo').classList.remove('oculto');
}
async function desbloquear() {
  $('#errBloqueo').textContent = '';
  try { await pedirHuella(); bloqueado = false; $('#bloqueo').classList.add('oculto'); }
  catch (e) { $('#errBloqueo').textContent = 'No se pudo verificar. Intenta de nuevo.'; }
}
$('#btnDesbloquear').addEventListener('click', desbloquear);
$('#btnOtraCuenta').addEventListener('click', () => { bloqueado = false; cerrarSesion(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) ocultoDesde = Date.now();
  else if (token && credId() && ocultoDesde && Date.now() - ocultoDesde > 60000) { bloquear(); desbloquear(); }
});

    : on ? 'Huella activa: se pide al abrir la app y al volver tras 1 minuto fuera.' : 'Activa la huella para proteger la app en este teléfono.';
  const b = $('#btnToggleHuella'); b.textContent = on ? 'Quitar huella' : 'Activar huella'; b.disabled = !huellaSoportada();
}
$('#btnSegu').addEventListener('click', () => { pintarSegu(); $('#segu').classList.remove('oculto'); });
$('#btnCerrarSegu').addEventListener('click', () => $('#segu').classList.add('oculto'));
$('#btnToggleHuella').addEventListener('click', async () => {
  try {
    if (credId()) { localStorage.removeItem('sw_cred'); toast('Huella desactivada'); }
    else {
      try { if (!localStorage.getItem('sw_tok')) { toast('Entra con “Recordar este dispositivo” para usar huella', true); return; } } catch(_){}
      await activarHuella(); toast('Huella activada ✔');
    }
  } catch (e) { toast('No se pudo activar la huella', true); }
  pintarSegu();
});
$('#btnTodos').addEventListener('click', async () => {
  if (!confirm('Se cerrará la sesión en TODOS los dispositivos (incluido este). ¿Continuar?')) return;
  try { await api('salirTodos'); } catch(_){} cerrarSesion();
});

/* Arranque: reanuda sesión; si hay huella configurada, pide desbloqueo */
(function(){
  const t = leerToken(); if (!t) return;
  token = t; cargar();
  if (credId()) { bloquear(); desbloquear(); }
})();
</script>
